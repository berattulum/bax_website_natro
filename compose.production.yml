name: bax-production

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_PROVIDER: postgres
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET}
  NEXT_PUBLIC_SITE_URL: ${SITE_URL}
  APP_URL: ${SITE_URL}
  ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
  REVALIDATION_SECRET: ${REVALIDATION_SECRET}
  PREVIEW_SECRET: ${PREVIEW_SECRET}
  MEDIA_DIR: /app/media
  MEDIA_EXPECTED_FILES: ${MEDIA_EXPECTED_FILES:-}
  MEDIA_EXPECTED_SHA256: ${MEDIA_EXPECTED_SHA256:-}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  TURNSTILE_ALLOWED_HOSTS: ${TURNSTILE_ALLOWED_HOSTS}
  UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
  UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}

x-backup-environment: &backup-environment
  PGHOST: postgres
  PGPORT: 5432
  PGDATABASE: ${POSTGRES_DB}
  PGUSER: ${POSTGRES_USER}
  PGPASSWORD: ${POSTGRES_PASSWORD}
  RESTIC_REPOSITORY: /repository
  RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
  BACKUP_HOST: ${BACKUP_HOST:-bax-natro}
  BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
  BACKUP_QUIESCE_SECONDS: ${BACKUP_QUIESCE_SECONDS:-10}
  BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
  BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
  BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
  TZ: ${TZ:-Europe/Istanbul}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    image: bax-production-migrate:local
    build:
      context: .
      target: migrator
    restart: "no"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  data-import:
    image: bax-production-migrate:local
    profiles: ["rehearsal"]
    entrypoint: ["node", "/app/scripts/migrate-sqlite-to-postgres.mjs"]
    environment:
      <<: *app-environment
      SQLITE_DATABASE_URL: file:/import/bax.db
    volumes:
      - ./bax.db:/import/bax.db:ro
      - ./media:/app/media:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  cache-revalidate:
    image: bax-production-migrate:local
    profiles: ["rehearsal"]
    entrypoint: ["node", "/app/scripts/revalidate-production.mjs"]
    environment:
      REVALIDATION_SECRET: ${REVALIDATION_SECRET}
      REVALIDATION_URL: http://app:3000/api/internal/revalidate
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  media-init:
    image: bax-production-app:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /app/media
        chown -R 1001:1001 /app/media
        mkdir -p /app/.next/cache
        chown -R 1001:1001 /app/.next/cache
    volumes:
      - type: volume
        source: media_data
        target: /app/media
        volume:
          nocopy: true
      - next_cache:/app/.next/cache
    restart: "no"
    security_opt:
      - no-new-privileges:true

  media-import:
    image: bax-production-app:local
    profiles: ["media"]
    user: "0:0"
    entrypoint: ["node", "/app/scripts/media-volume.mjs", "import"]
    environment:
      MEDIA_SOURCE_DIR: /import
      MEDIA_DIR: /app/media
      MEDIA_EXPECTED_FILES: ${MEDIA_EXPECTED_FILES:-}
      MEDIA_EXPECTED_SHA256: ${MEDIA_EXPECTED_SHA256:-}
      MEDIA_OWNER_UID: 1001
      MEDIA_OWNER_GID: 1001
    volumes:
      - ./media:/import:ro
      - type: volume
        source: media_data
        target: /app/media
        volume:
          nocopy: true
    restart: "no"
    security_opt:
      - no-new-privileges:true

  media-audit:
    image: bax-production-app:local
    profiles: ["media"]
    entrypoint: ["node", "/app/scripts/media-volume.mjs", "audit"]
    environment: *app-environment
    volumes:
      - type: volume
        source: media_data
        target: /app/media
        read_only: true
        volume:
          nocopy: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  app:
    image: bax-production-app:local
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - type: volume
        source: media_data
        target: /app/media
        volume:
          nocopy: true
      - next_cache:/app/.next/cache
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - frontend

  nginx:
    image: bax-production-nginx:local
    build:
      context: ./nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      SERVER_NAMES: ${SERVER_NAMES}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/_nginx/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    networks:
      - frontend

  certbot:
    image: certbot/certbot:v4.0.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet
          sleep 12h & wait $$!
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - frontend

  certbot-init:
    image: certbot/certbot:v4.0.0
    profiles: ["ssl"]
    entrypoint: ["certbot", "certonly"]
    command:
      - --webroot
      - --webroot-path=/var/www/certbot
      - --email=${CERTBOT_EMAIL}
      - --agree-tos
      - --no-eff-email
      - --non-interactive
      - --cert-name=${DOMAIN}
      - --domain=${DOMAIN}
      - --domain=${WWW_DOMAIN}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - frontend

  backup:
    image: bax-production-backup:local
    build:
      context: ./backup
    profiles: ["backup"]
    command: ["/usr/local/bin/schedule.sh"]
    restart: unless-stopped
    environment: *backup-environment
    volumes:
      - ${BACKUP_REPOSITORY_PATH:-./backups/restic}:/repository
      - type: volume
        source: media_data
        target: /media
        volume:
          nocopy: true
      - type: volume
        source: letsencrypt
        target: /letsencrypt
        read_only: true
        volume:
          nocopy: true
    tmpfs:
      - /staging:size=2g,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  backup-once:
    image: bax-production-backup:local
    build:
      context: ./backup
    profiles: ["backup-tools"]
    command: ["/usr/local/bin/backup.sh"]
    restart: "no"
    environment: *backup-environment
    volumes:
      - ${BACKUP_REPOSITORY_PATH:-./backups/restic}:/repository
      - type: volume
        source: media_data
        target: /media
        volume:
          nocopy: true
      - type: volume
        source: letsencrypt
        target: /letsencrypt
        read_only: true
        volume:
          nocopy: true
    tmpfs:
      - /staging:size=2g,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  restore:
    image: bax-production-backup:local
    build:
      context: ./backup
    profiles: ["restore"]
    command: ["/usr/local/bin/restore.sh"]
    restart: "no"
    environment:
      <<: *backup-environment
      RESTORE_SNAPSHOT: ${RESTORE_SNAPSHOT:-latest}
      RESTORE_MODE: ${RESTORE_MODE:-verify}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
    volumes:
      - ${BACKUP_REPOSITORY_PATH:-./backups/restic}:/repository
      - type: volume
        source: media_data
        target: /media
        volume:
          nocopy: true
      - type: volume
        source: letsencrypt
        target: /letsencrypt
        volume:
          nocopy: true
    tmpfs:
      - /restore-work:size=2g,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  postgres_data:
    name: bax_production_postgres_data
  media_data:
    name: bax_production_media_data
  next_cache:
    name: bax_production_next_cache
  letsencrypt:
    name: bax_production_letsencrypt
  certbot_webroot:
    name: bax_production_certbot_webroot

networks:
  backend:
    internal: true
  frontend:
    name: bax_frontend
